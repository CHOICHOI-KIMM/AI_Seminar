<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DLC 시계열 피로해석 — 발표 대시보드</title>
<style>
  :root{
    --ink:#16202b; --ink2:#4a5866; --line:#d7dde4; --bg:#ffffff; --panel:#f6f8fa;
    --accent:#12467d; --accent2:#2f7fd1; --warn:#c0392b; --ok:#1f7a4d;
    --c1:#9fb3c8; --c2:#6f93b8; --c3:#3f74a6; --c4:#1f5288; --c5:#0e3159;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#e9edf1;color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{position:relative}
  #stage{width:1280px;height:720px;background:var(--bg);position:relative;
    transform-origin:center center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    display:flex;flex-direction:column;padding:30px 44px 22px}
  #top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #dots{display:flex;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:#ccd4dc;cursor:pointer}
  .dot.on{background:var(--accent)}
  #counter{margin-left:auto;font-size:13px;color:var(--ink2);letter-spacing:.02em}
  h1{font-size:31px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .lead{font-size:16px;color:var(--ink2);margin-top:5px}
  .rule{height:3px;background:var(--accent);width:54px;margin:11px 0 14px}
  #body{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .row{display:flex;gap:14px;min-height:0}
  .row.grow{flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:11px 13px;display:flex;flex-direction:column;min-width:0;min-height:0}
  .card>h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px}
  .card .svgbox{flex:1;min-height:0}
  svg{display:block;width:100%;height:100%;overflow:visible}
  .kpis{display:flex;gap:12px}
  .kpi{flex:1;background:var(--panel);border:1px solid var(--line);
    border-top:3px solid var(--accent);border-radius:5px;padding:11px 14px}
  .kpi .v{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
  .kpi .l{font-size:12.5px;color:var(--ink2);margin-top:5px}
  .kpi .s{font-size:11.5px;color:#8695a4;margin-top:2px}
  .kpi.bad{border-top-color:var(--warn)} .kpi.bad .v{color:var(--warn)}
  .kpi.good{border-top-color:var(--ok)} .kpi.good .v{color:var(--ok)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
  th{background:#eef2f6;font-weight:700;color:var(--ink2);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.hl td{background:#e8f0f9;font-weight:700}
  ul.pts{list-style:none;font-size:14px;line-height:1.65}
  ul.pts li{padding-left:15px;position:relative;margin-bottom:4px}
  ul.pts li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;
    background:var(--accent2);border-radius:1px}
  ul.pts b{color:var(--accent)}
  #take{margin-top:10px;padding:9px 14px;background:#0f2f52;color:#fff;border-radius:5px;
    font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  #take:empty{display:none}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:4px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  #help{position:fixed;bottom:8px;right:12px;font-size:11px;color:#7b8896}
  @media print{
    body{display:block;background:#fff} #stage{box-shadow:none;transform:none!important;page-break-after:always}
    #help{display:none}
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="top"><div id="dots"></div><div id="counter"></div></div>
  <h1 id="title"></h1>
  <div class="lead" id="lead"></div>
  <div class="rule"></div>
  <div id="body"></div>
  <div id="take"></div>
</div></div>
<div id="help">← → 이동 · F11 전체화면</div>

<script src="data.js"></script>
<script src="slides_A.js"></script>
<script>
/* ═══════════════ SVG 유틸 ═══════════════ */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, o){
  o = o || {};
  const t = el("text", {x:x, y:y, "font-size":o.size||11,
    "text-anchor":o.anchor||"start", fill:o.fill||"#4a5866",
    "font-weight":o.weight||400}, parent);
  t.textContent = s;
  return t;
}
function niceTicks(lo, hi, n){
  const span = hi - lo, raw = span/(n||5), p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw) || 10*p;
  const out = [];
  for (let v = Math.ceil(lo/step)*step; v <= hi+1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
const fmt = n => n.toLocaleString("ko-KR");
function frame(svg, w, h, m){
  el("line", {x1:m.l, y1:h-m.b, x2:w-m.r, y2:h-m.b, stroke:"#b9c3cd"}, svg);
  el("line", {x1:m.l, y1:m.t, x2:m.l, y2:h-m.b, stroke:"#b9c3cd"}, svg);
}

const CHART = {};

/* ── 파이프라인 도해 ── */
CHART.pipeline = function(svg, w, h, c){
  const S = c.stages, n = S.length, gap = 14, bw = (w - gap*(n-1))/n;
  S.forEach((s,i)=>{
    const x = i*(bw+gap);
    el("rect",{x:x,y:6,width:bw,height:h-30,rx:5,fill:"#fff",
      stroke:s.on?"var(--accent)":"#c9d2db","stroke-width":s.on?2.2:1.2},svg);
    el("rect",{x:x,y:6,width:bw,height:26,rx:5,fill:s.on?"var(--accent)":"#e6ebf0"},svg);
    txt(svg, x+bw/2, 24, s.tag, {anchor:"middle", weight:700, size:13.5, fill:s.on?"#fff":"#4a5866"});
    (s.lines||[]).forEach((t,j)=> txt(svg, x+10, 50+j*18, t, {size:12, fill:"#16202b"}));
    if (s.cost) txt(svg, x+bw/2, h-30, s.cost, {anchor:"middle", size:12.5, weight:700, fill:"var(--accent)"});
    if (i<n-1) el("path",{d:`M${x+bw+2} ${h/2-6}l8 6l-8 6`,stroke:"#9aa7b4",fill:"none","stroke-width":2},svg);
  });
};

/* ── 범용 막대 ── */
CHART.bars = function(svg, w, h, c){
  const I = c.items, m = {l:c.left||46, r:16, t:12, b:30};
  const max = Math.max.apply(null, I.map(d=>d.v)) * 1.16 || 1;
  const step = (w-m.l-m.r)/I.length, bw = step*(c.thin?0.5:0.62);
  I.forEach((d,i)=>{
    const x = m.l + i*step + (step-bw)/2;
    const bh = (d.v/max)*(h-m.t-m.b);
    el("rect",{x:x, y:h-m.b-bh, width:bw, height:bh, rx:2,
      fill: d.hl ? "var(--accent)" : (d.v===0 ? "#cdd6de" : "var(--c3)")},svg);
    txt(svg, x+bw/2, h-m.b-bh-5, (d.t!==undefined?d.t:d.v), {anchor:"middle", weight:700,
      size:11.5, fill: d.hl?"var(--accent)":"#4a5866"});
    txt(svg, x+bw/2, h-m.b+15, d.label, {anchor:"middle", size:11.5});
    if (d.sub) txt(svg, x+bw/2, h-m.b+27, d.sub, {anchor:"middle", size:10.5, fill:"#8695a4"});
  });
  frame(svg,w,h,m);
  if (c.ylab) txt(svg, m.l-6, m.t+8, c.ylab, {anchor:"end", size:11});
  if (c.xlab) txt(svg, w-m.r, h-3, c.xlab, {anchor:"end", size:11.5});
};

/* ── 비용 비교 (좌우 막대 + 배수) ── */
CHART.compare = function(svg, w, h, c){
  const R = c.rows, m = {l:126, r:120, t:12, b:14};
  const step = (h-m.t-m.b)/R.length, bh = step*0.30, wmax = w-m.l-m.r;
  R.forEach((r,i)=>{
    const y = m.t + i*step;
    const ratio = Math.min(1, Math.log10(Math.max(r.a,r.b)/Math.min(r.a,r.b))/3);
    const wa = r.a>=r.b ? wmax*Math.max(.14,ratio) : wmax*Math.max(.14,ratio)*(r.a/r.b);
    const wb = r.b> r.a ? wmax*Math.max(.14,ratio) : wmax*Math.max(.14,ratio)*(r.b/r.a);
    txt(svg, m.l-10, y+step/2, r.label, {anchor:"end", weight:700, size:13, fill:"#16202b"});
    el("rect",{x:m.l,y:y+2,width:Math.max(3,wa),height:bh,rx:2,fill:"var(--warn)","fill-opacity":.85},svg);
    txt(svg, m.l+Math.max(3,wa)+7, y+2+bh-1, r.at, {size:12.5, weight:700, fill:"var(--warn)"});
    el("rect",{x:m.l,y:y+bh+7,width:Math.max(3,wb),height:bh,rx:2,fill:"var(--ok)","fill-opacity":.9},svg);
    txt(svg, m.l+Math.max(3,wb)+7, y+bh*2+6, r.bt, {size:12.5, weight:700, fill:"var(--ok)"});
    if (r.gain) txt(svg, w-4, y+step/2+4, r.gain, {anchor:"end", size:14, weight:700, fill:"var(--accent)"});
  });
  txt(svg, m.l, h-1, "■ 참값 (dt = 0.1 s)", {size:11, fill:"var(--warn)", weight:700});
  txt(svg, m.l+124, h-1, "■ 조합 (빈 압축)", {size:11, fill:"var(--ok)", weight:700});
};

/* ── 빈 압축 개념도 ── */
CHART.binning = function(svg, w, h){
  const m = {l:12, r:12, t:16, b:26};
  const midY = h*0.44, ampl = h*0.22, x0 = m.l, x1 = w*0.52;
  // 시계열 (의사 파형 — 개념도)
  let d = "";
  const N = 160;
  for (let i=0;i<=N;i++){
    const t = i/N, x = x0 + t*(x1-x0);
    const v = Math.sin(t*13.5)*0.55 + Math.sin(t*31.0)*0.28 + Math.sin(t*57.0)*0.17;
    d += (i?"L":"M") + x.toFixed(1) + " " + (midY - v*ampl).toFixed(1);
  }
  el("path",{d:d, stroke:"var(--c3)", fill:"none", "stroke-width":1.1},svg);
  txt(svg, x0, m.t, "시계열 6,001점 (dt = 0.1 s)", {weight:700, size:12.5, fill:"#16202b"});
  txt(svg, x0, h-m.b+16, "→ dt 간격 재표본 → 하중 크기로 빈 분할", {size:11.5});

  // 빈 막대
  const bx0 = w*0.60, bx1 = w-m.r, nb = 8;
  const vals = [0.30,0.52,0.78,1.00,0.86,0.61,0.38,0.19];
  const bw = (bx1-bx0)/nb*0.66, step = (bx1-bx0)/nb;
  vals.forEach((v,i)=>{
    const bh = v*(h-m.t-m.b-30);
    const x = bx0 + i*step + (step-bw)/2;
    el("rect",{x:x, y:h-m.b-bh, width:bw, height:bh, rx:2,
      fill:"var(--accent)", "fill-opacity": 0.35+0.5*v},svg);
  });
  txt(svg, bx0, m.t, "대표 빈 (평균 + k·σ)", {weight:700, size:12.5, fill:"#16202b"});
  txt(svg, bx0, h-m.b+16, "→ 빈 1개당 MASTA 해석 1회", {size:11.5});
  // 화살표
  el("path",{d:`M${w*0.535} ${midY}l22 0m-6 -5l6 5l-6 5`,stroke:"var(--accent)",
    fill:"none","stroke-width":2},svg);
  txt(svg, w*0.545, midY-10, "압축", {size:11.5, weight:700, fill:"var(--accent)"});
};

/* ── ε 예측 vs 실측 산점도 ── */
CHART.errscatter = function(svg, w, h, c){
  const m = {l:52, r:14, t:14, b:34};
  const S = DATA.scatter;                         // 예측·실측 ε 보유 (111건)
  const pk = c.axis === "Sys" ? "pred_Sys" : "pred_UW";
  const mk = c.axis === "Sys" ? "meas_Sys" : "meas_UW";
  const pts = S.map(s=>({x:s[pk], y:s[mk], pass:s.pass, dlc:s.dlc}));
  const all = pts.flatMap(p=>[p.x,p.y]);
  const lo = Math.min(-1, Math.min.apply(null, all)-0.4);
  const hi = Math.max(5, Math.max.apply(null, all)+0.4);
  const X = v => m.l + (v-lo)/(hi-lo)*(w-m.l-m.r);
  const Y = v => h-m.b - (v-lo)/(hi-lo)*(h-m.t-m.b);
  // 합격창 0~+3%
  el("rect",{x:m.l, y:Y(3), width:w-m.l-m.r, height:Y(0)-Y(3),
    fill:"var(--ok)","fill-opacity":.09},svg);
  txt(svg, w-m.r-4, Y(3)-5, "합격창 0 ~ +3%", {anchor:"end", size:11.5, weight:700, fill:"var(--ok)"});
  niceTicks(lo,hi,5).forEach(v=>{
    el("line",{x1:m.l,y1:Y(v),x2:w-m.r,y2:Y(v),stroke:"#e4e9ee"},svg);
    txt(svg, m.l-6, Y(v)+4, v+"%", {anchor:"end"});
    txt(svg, X(v), h-m.b+15, v+"%", {anchor:"middle"});
  });
  frame(svg,w,h,m);
  // y = x
  el("line",{x1:X(lo),y1:Y(lo),x2:X(hi),y2:Y(hi),stroke:"#9aa7b4","stroke-dasharray":"4 4"},svg);
  txt(svg, X(hi)-6, Y(hi)+14, "완전 일치", {anchor:"end", size:11, fill:"#8695a4"});
  pts.forEach(p=>{
    el("circle",{cx:X(p.x), cy:Y(p.y), r: p.pass?3.4:5,
      fill: p.pass ? "var(--accent)" : "var(--warn)",
      "fill-opacity": p.pass?0.72:0.95,
      stroke: p.pass?"none":"#fff", "stroke-width":1.2},svg);
  });
  txt(svg, (m.l+w-m.r)/2, h-3, "스크리닝 예측 ε_"+(c.axis||"UW")+" [%]", {anchor:"middle", size:11.5});
  txt(svg, 10, m.t+2, "MASTA 실측 ε [%]", {size:11.5});
  svg.parentNode.insertAdjacentHTML("afterend",
    `<div class="legend"><span><i style="background:var(--accent)"></i>합격 ${DATA.kpi.n_pass}</span>
     <span><i style="background:var(--warn)"></i>불합격 ${DATA.kpi.n_fail}</span>
     <span>· 초록 띠 = 판정 허용창</span></div>`);
};

/* ── 손상 커버리지 곡선 ── */
CHART.coverage = function(svg, w, h, c){
  const C = DATA.coverage, m = {l:46, r:16, t:14, b:32}, n = C.length;
  const X = i => m.l + (i-1)/(n-1)*(w-m.l-m.r);
  const Y = v => h-m.b - v/100*(h-m.t-m.b);
  [25,50,75,100].forEach(v=>{
    el("line",{x1:m.l,y1:Y(v),x2:w-m.r,y2:Y(v),stroke:"#e4e9ee"},svg);
    txt(svg, m.l-6, Y(v)+4, v+"%", {anchor:"end"});
  });
  [1,20,40,60,80,100,111].forEach(v=>txt(svg, X(v), h-m.b+15, v, {anchor:"middle"}));
  frame(svg,w,h,m);
  let d = "";
  C.forEach((p,i)=> d += (i?"L":"M") + X(p.n).toFixed(1) + " " + Y(p.dmg_pct).toFixed(1));
  el("path",{d:d+`L${X(n)} ${Y(0)}L${X(1)} ${Y(0)}Z`, fill:"var(--accent)","fill-opacity":.10},svg);
  el("path",{d:d, stroke:"var(--accent)", fill:"none", "stroke-width":2.2},svg);
  // 불합격 위치
  C.forEach(p=>{ if(p.fail)
    el("circle",{cx:X(p.n), cy:Y(p.dmg_pct), r:3.4, fill:"var(--warn)"},svg); });
  // 마커
  [{n:DATA.cov_marks["50"], t:"상위 "+DATA.cov_marks["50"]+"개 = 손상 50%"},
   {n:DATA.cov_marks["90"], t:"상위 "+DATA.cov_marks["90"]+"개 = 90%"}].forEach(k=>{
    const p = C[k.n-1];
    el("line",{x1:X(k.n),y1:Y(0),x2:X(k.n),y2:Y(p.dmg_pct),stroke:"var(--accent2)",
      "stroke-dasharray":"4 3","stroke-width":1.4},svg);
    el("circle",{cx:X(k.n),cy:Y(p.dmg_pct),r:4,fill:"#fff",stroke:"var(--accent2)","stroke-width":2},svg);
    txt(svg, X(k.n)+8, Y(p.dmg_pct)-6, k.t, {size:12, weight:700, fill:"var(--accent2)"});
  });
  txt(svg, (m.l+w-m.r)/2, h-2, "DLC 개수 (참값 손상 내림차순)", {anchor:"middle", size:11.5});
  txt(svg, 8, m.t+2, "누적 손상 [%]", {size:11.5});
  svg.parentNode.insertAdjacentHTML("afterend",
    `<div class="legend"><span><i style="background:var(--warn)"></i>불합격 ${DATA.kpi.n_fail}건 — 합계 손상 기여 ${DATA.fail_share_pct}%</span></div>`);
};

/* ═══════════════ 렌더 ═══════════════ */
function buildTable(t){
  let s = "<table><thead><tr>";
  t.head.forEach(h=> s += `<th class="${/[\d\[]/.test(h)?"num":""}">${h}</th>`);
  s += "</tr></thead><tbody>";
  t.rows.forEach(r=>{
    const cls = r.cls ? ` class="${r.cls}"` : "";
    const cells = r.cells || r;
    s += `<tr${cls}>` + cells.map((c,i)=>`<td class="${i>0?"num":""}">${c}</td>`).join("") + "</tr>";
  });
  return s + "</tbody></table>";
}

function renderBlock(b, host){
  if (b.type === "kpis"){
    const d = document.createElement("div");
    d.className = "kpis";
    d.innerHTML = b.items.map(k=>
      `<div class="kpi ${k.tone||""}"><div class="v">${k.value}</div>
       <div class="l">${k.label}</div>${k.sub?`<div class="s">${k.sub}</div>`:""}</div>`).join("");
    host.appendChild(d);
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  if (b.flex) card.style.flex = b.flex;
  if (b.title) card.innerHTML = `<h3>${b.title}</h3>`;
  if (b.type === "table") card.innerHTML += buildTable(b);
  else if (b.type === "points") card.innerHTML +=
    `<ul class="pts">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  else {
    const box = document.createElement("div");
    box.className = "svgbox";
    card.appendChild(box);
    host.appendChild(card);
    const r = box.getBoundingClientRect();
    const W = Math.max(200, r.width/SCALE), H = Math.max(120, r.height/SCALE);
    const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:"none"}, box);
    (CHART[b.type] || function(){})(svg, W, H, b);
    return;
  }
  host.appendChild(card);
}

let cur = 0;
function render(i){
  cur = (i + SLIDES.length) % SLIDES.length;
  const s = SLIDES[cur];
  document.getElementById("title").textContent = s.title;
  document.getElementById("lead").textContent = s.lead || "";
  document.getElementById("take").textContent = s.takeaway || "";
  document.getElementById("counter").textContent =
    (s.no || cur+1) + " / " + SLIDES.length + "   ·   DLC 시계열 피로해석";
  const dots = document.getElementById("dots");
  dots.innerHTML = SLIDES.map((_,j)=>`<div class="dot ${j===cur?"on":""}" data-i="${j}"></div>`).join("");
  dots.querySelectorAll(".dot").forEach(d=>d.onclick=()=>render(+d.dataset.i));
  const body = document.getElementById("body");
  body.innerHTML = "";
  (s.rows||[]).forEach(row=>{
    const r = document.createElement("div");
    r.className = "row" + (row.grow===false ? "" : " grow");
    body.appendChild(r);
    row.blocks.forEach(b=>renderBlock(b, r));
  });
}

let SCALE = 1;
function fit(){
  const sc = SCALE = Math.min(window.innerWidth/1300, window.innerHeight/740);
  const st = document.getElementById("stage"), wr = document.getElementById("wrap");
  st.style.transform = `scale(${sc})`;
  wr.style.width = (1280*sc)+"px"; wr.style.height = (720*sc)+"px";
  st.style.position = "absolute";
  st.style.left = ((1280*sc-1280)/2)+"px";
  st.style.top  = ((720*sc-720)/2)+"px";
}
window.addEventListener("resize", ()=>{fit(); render(cur);});
document.addEventListener("keydown", e=>{
  if (e.key === "ArrowRight" || e.key === " ") render(cur+1);
  if (e.key === "ArrowLeft") render(cur-1);
});
fit();
render(0);
</script>
</body>
</html>
