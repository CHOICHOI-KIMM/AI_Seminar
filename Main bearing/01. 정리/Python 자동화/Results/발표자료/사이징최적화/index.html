<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메인베어링 사이징 최적화 — 발표 대시보드</title>
<style>
  :root{
    --ink:#16202b; --ink2:#4a5866; --line:#d7dde4; --bg:#ffffff; --panel:#f6f8fa;
    --accent:#12467d; --accent2:#2f7fd1; --warn:#c0392b; --ok:#1f7a4d;
    --c1:#9fb3c8; --c2:#6f93b8; --c3:#3f74a6; --c4:#1f5288; --c5:#0e3159;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#e9edf1;color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #wrap{position:relative}
  #stage{width:1280px;height:720px;background:var(--bg);position:relative;
    transform-origin:center center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    display:flex;flex-direction:column;padding:30px 44px 22px}
  /* ── 상단 ── */
  #top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  #dots{display:flex;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:#ccd4dc;cursor:pointer}
  .dot.on{background:var(--accent)}
  #counter{margin-left:auto;font-size:13px;color:var(--ink2);letter-spacing:.02em}
  #setsw{display:flex;gap:5px;margin-left:16px}
  .sw{font-size:11.5px;padding:2px 9px;border:1px solid var(--line);border-radius:11px;
    color:var(--ink2);cursor:pointer;background:#fff;white-space:nowrap}
  .sw.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  h1{font-size:31px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .lead{font-size:16px;color:var(--ink2);margin-top:5px}
  .rule{height:3px;background:var(--accent);width:54px;margin:11px 0 14px}
  /* ── 본문 ── */
  #body{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .row{display:flex;gap:14px;min-height:0}
  .row.grow{flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:11px 13px;display:flex;flex-direction:column;min-width:0;min-height:0}
  .card>h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px;
    letter-spacing:.02em;text-transform:none}
  .card .svgbox{flex:1;min-height:0}
  svg{display:block;width:100%;height:100%;overflow:visible}
  /* KPI */
  .kpis{display:flex;gap:12px}
  .kpi{flex:1;background:var(--panel);border:1px solid var(--line);
    border-top:3px solid var(--accent);border-radius:5px;padding:11px 14px}
  .kpi .v{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
  .kpi .l{font-size:12.5px;color:var(--ink2);margin-top:5px}
  .kpi .s{font-size:11.5px;color:#8695a4;margin-top:2px}
  .kpi.bad{border-top-color:var(--warn)} .kpi.bad .v{color:var(--warn)}
  .kpi.good{border-top-color:var(--ok)} .kpi.good .v{color:var(--ok)}
  /* 표 */
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
  th{background:#eef2f6;font-weight:700;color:var(--ink2);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.hl td{background:#e8f0f9;font-weight:700}
  tr.bad td{color:var(--warn)}
  /* 불릿 */
  ul.pts{list-style:none;font-size:14px;line-height:1.65}
  ul.pts li{padding-left:15px;position:relative;margin-bottom:4px}
  ul.pts li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;
    background:var(--accent2);border-radius:1px}
  ul.pts b{color:var(--accent)}
  /* 하단 결론 */
  #take{margin-top:10px;padding:9px 14px;background:#0f2f52;color:#fff;border-radius:5px;
    font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  #take:empty{display:none}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:4px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  #help{position:fixed;bottom:8px;right:12px;font-size:11px;color:#7b8896}
  @media print{
    body{display:block;background:#fff} #stage{box-shadow:none;transform:none!important;page-break-after:always}
    #help{display:none}
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="top">
    <div id="dots"></div>
    <div id="setsw"></div>
    <div id="counter"></div>
  </div>
  <h1 id="title"></h1>
  <div class="lead" id="lead"></div>
  <div class="rule"></div>
  <div id="body"></div>
  <div id="take"></div>
</div></div>
<div id="help">← → 이동 · A·B 키로 구성안 전환 · F11 전체화면</div>

<script src="data.js"></script>
<script src="slides_A.js"></script>
<script src="slides_B.js"></script>
<script>
/* ═══════════════ SVG 유틸 ═══════════════ */
const NS = "http://www.w3.org/2000/svg";
const PAL = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];

function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, o){
  o = o || {};
  const t = el("text", {x:x, y:y, "font-size":o.size||11,
    "text-anchor":o.anchor||"start", fill:o.fill||"#4a5866",
    "font-weight":o.weight||400}, parent);
  t.textContent = s;
  return t;
}
function niceTicks(lo, hi, n){
  const span = hi - lo, raw = span / (n||5), p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw) || 10*p;
  const out = [];
  for (let v = Math.ceil(lo/step)*step; v <= hi+1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
const fmt = n => n.toLocaleString("ko-KR");

/* 좌표계가 필요한 차트의 공통 프레임 */
function frame(svg, w, h, m){
  el("line", {x1:m.l, y1:h-m.b, x2:w-m.r, y2:h-m.b, stroke:"#b9c3cd"}, svg);
  el("line", {x1:m.l, y1:m.t, x2:m.l, y2:h-m.b, stroke:"#b9c3cd"}, svg);
}

/* ═══════════════ 차트 ═══════════════ */
const CHART = {};

/* 산점도 — 질량 vs σ */
CHART.scatter = function(svg, w, h, c){
  const P = DATA.p1.points, m = {l:52, r:12, t:12, b:34};
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for (const p of P){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  x0 = Math.min(x0, DATA.baseline.mass_t) - 5; x1 += 5;
  y0 = Math.min(y0, 1600); y1 = Math.max(y1, DATA.baseline.sigma) + 100;
  const X = v => m.l + (v-x0)/(x1-x0)*(w-m.l-m.r);
  const Y = v => h-m.b - (v-y0)/(y1-y0)*(h-m.t-m.b);

  niceTicks(y0,y1,5).forEach(v=>{
    el("line",{x1:m.l,y1:Y(v),x2:w-m.r,y2:Y(v),stroke:"#e4e9ee"},svg);
    txt(svg, m.l-6, Y(v)+4, fmt(v), {anchor:"end"});
  });
  niceTicks(x0,x1,6).forEach(v=>txt(svg, X(v), h-m.b+15, fmt(v), {anchor:"middle"}));
  frame(svg,w,h,m);
  txt(svg, (m.l+w-m.r)/2, h-4, "질량 [t]  (베어링 2 + 샤프트)", {anchor:"middle", size:11.5});
  txt(svg, 12, m.t+4, "σ_max [MPa]", {size:11.5});

  // 불가능해 → 가능해 순으로 그려 가능해가 위에 오게 한다
  for (const pass of [0,1]) for (const p of P){
    if (p[3] !== pass) continue;
    el("circle", {cx:X(p[0]), cy:Y(p[1]), r: pass?2.1:1.5,
      fill: PAL[p[2]], "fill-opacity": pass?0.95:0.28}, svg);
  }
  // 한계선
  const yl = Y(DATA.limits.sigma);
  el("line",{x1:m.l,y1:yl,x2:w-m.r,y2:yl,stroke:"var(--warn)","stroke-width":1.6,"stroke-dasharray":"6 4"},svg);
  txt(svg, w-m.r-4, yl-6, "한계 2,100 MPa", {anchor:"end", fill:"var(--warn)", weight:700, size:12});
  // 기준선
  const bx=X(DATA.baseline.mass_t), by=Y(DATA.baseline.sigma);
  el("path",{d:`M${bx} ${by-7}L${bx+7} ${by}L${bx} ${by+7}L${bx-7} ${by}Z`,
    fill:"#fff",stroke:"var(--warn)","stroke-width":2},svg);
  txt(svg, bx+11, by+4, "기준선 54.4 t · 3,424 MPa", {fill:"var(--warn)", weight:700, size:12});
  // 대표안
  if (c.mark){
    const d = DATA.p2.find(p=>p.design===c.mark);
    if (d){
      const mx=X(d.mass_t), my=Y(d.sigma);
      el("circle",{cx:mx,cy:my,r:7,fill:"none",stroke:"var(--ok)","stroke-width":2.2},svg);
      txt(svg, mx+11, my+4, c.mark+" "+d.mass_t+" t · "+fmt(d.sigma)+" MPa",
        {fill:"var(--ok)", weight:700, size:12});
    }
  }
  const lg = ["110","140","170","200","230"].map((v,i)=>
    `<span><i style="background:${PAL[i]}"></i>D_we ${v}</span>`).join("");
  svg.parentNode.insertAdjacentHTML("afterend",
    `<div class="legend">${lg}<span>· 옅은 점 = 응력 초과</span></div>`);
};

/* 퍼널 */
CHART.funnel = function(svg, w, h){
  const F = DATA.funnel, n = F.length, gap = 9;
  const bh = (h - gap*(n-1)) / n, max = F[0].value;
  F.forEach((f,i)=>{
    const y = i*(bh+gap);
    const bw = Math.max(140, (w-190) * Math.pow(f.value/max, 0.34));
    el("rect",{x:0,y:y,width:bw,height:bh,rx:3,
      fill: i===F.length-1 ? "var(--ok)" : (i===2 ? "var(--accent)" : "var(--c3)"),
      "fill-opacity": i===0?0.55:(i===1?0.7:1)}, svg);
    txt(svg, 11, y+bh/2+2, f.label, {fill:"#fff", weight:700, size:13.5});
    txt(svg, bw+10, y+bh/2-2, fmt(f.value)+"점", {weight:700, size:14, fill:"#16202b"});
    txt(svg, bw+10, y+bh/2+13, f.note+"  ·  잔존 "+(100*f.value/max).toFixed(1)+"%", {size:11});
    if (i < n-1) el("path",{d:`M18 ${y+bh+1}l6 6l-6 6`,stroke:"#9aa7b4",fill:"none","stroke-width":1.6},svg);
  });
};

/* 변수별 가능률 막대 */
CHART.marginal = function(svg, w, h, c){
  const V = DATA.marginal[c.varKey], L = V.levels;
  const m={l:46,r:16,t:8,b:26}, n=L.length;
  const max = Math.max.apply(null, L.map(d=>d.rate)) * 1.15 || 1;
  const bw = (w-m.l-m.r)/n*0.62, step=(w-m.l-m.r)/n;
  L.forEach((d,i)=>{
    const x = m.l + i*step + (step-bw)/2;
    const bh = (d.rate/max)*(h-m.t-m.b);
    el("rect",{x:x,y:h-m.b-bh,width:bw,height:bh,rx:2,
      fill: d.rate===0?"#cdd6de":"var(--accent)"},svg);
    txt(svg, x+bw/2, h-m.b-bh-5, d.rate.toFixed(1)+"%", {anchor:"middle", weight:700,
      size:11.5, fill:d.rate===0?"#8695a4":"var(--accent)"});
    txt(svg, x+bw/2, h-m.b+14, (d.level%1?d.level.toFixed(1):d.level), {anchor:"middle", size:11.5});
  });
  frame(svg,w,h,m);
  txt(svg, m.l-6, m.t+8, "가능률", {anchor:"end", size:11});
  txt(svg, w-m.r, h-4, V.label, {anchor:"end", size:11.5});
};

/* 효과 막대 (좌우 발산) */
CHART.effect = function(svg, w, h, c){
  const I = c.items, m={l:150,r:60,t:10,b:20};
  const span = Math.max.apply(null, I.map(d=>Math.max(Math.abs(d.lo||d.v), Math.abs(d.hi||d.v)))) * 1.15;
  const cx = m.l + (w-m.l-m.r)/2, half=(w-m.l-m.r)/2;
  const X = v => cx + v/span*half;
  const bh = (h-m.t-m.b)/I.length*0.5, step=(h-m.t-m.b)/I.length;
  el("line",{x1:cx,y1:m.t,x2:cx,y2:h-m.b,stroke:"#b9c3cd"},svg);
  txt(svg, cx, h-m.b+14, "0%", {anchor:"middle", size:11});
  I.forEach((d,i)=>{
    const y = m.t + i*step + (step-bh)/2;
    const lo = d.lo!==undefined?d.lo:d.v, hi = d.hi!==undefined?d.hi:d.v;
    const x1 = X(Math.min(lo,hi)), x2 = X(Math.max(lo,hi));
    const good = hi <= 0;
    el("rect",{x:Math.min(x1,cx),y:y,width:Math.max(2,Math.abs(x2-x1)||Math.abs(x1-cx)),height:bh,rx:2,
      fill: good ? "var(--ok)" : (lo<0&&hi>0 ? "var(--accent2)" : "var(--warn)"),
      "fill-opacity":.88},svg);
    txt(svg, m.l-10, y+bh/2+4, d.label, {anchor:"end", weight:700, size:12.5, fill:"#16202b"});
    txt(svg, (x2>cx?x2+6:Math.min(x1,cx)-6), y+bh/2+4, d.text,
      {anchor:(x2>cx?"start":"end"), size:11.5, weight:700});
    if (d.note) txt(svg, m.l-10, y+bh/2+18, d.note, {anchor:"end", size:10.5, fill:"#8695a4"});
  });
};

/* 기준선 vs 후보 비교 (로그 스케일) */
CHART.compare = function(svg, w, h, c){
  const R = c.rows, m={l:112,r:96,t:10,b:18};
  const step=(h-m.t-m.b)/R.length, bh=step*0.30;
  R.forEach((r,i)=>{
    const y = m.t + i*step;
    const lo = Math.log10(Math.max(r.a, r.b)/Math.min(r.a, r.b));
    const wmax = w-m.l-m.r, ratio = Math.min(1, lo/3);
    const wa = r.a>=r.b ? wmax*Math.max(.12,ratio) : wmax*Math.max(.12,ratio)*(r.a/r.b);
    const wb = r.b> r.a ? wmax*Math.max(.12,ratio) : wmax*Math.max(.12,ratio)*(r.b/r.a);
    txt(svg, m.l-10, y+step/2, r.label, {anchor:"end", weight:700, size:13, fill:"#16202b"});
    el("rect",{x:m.l,y:y+2,width:Math.max(3,wa),height:bh,rx:2,fill:"#c0392b","fill-opacity":.85},svg);
    txt(svg, m.l+Math.max(3,wa)+7, y+2+bh-1, r.at, {size:12, weight:700, fill:"var(--warn)"});
    el("rect",{x:m.l,y:y+bh+7,width:Math.max(3,wb),height:bh,rx:2,fill:"var(--ok)","fill-opacity":.9},svg);
    txt(svg, m.l+Math.max(3,wb)+7, y+bh*2+6, r.bt, {size:12, weight:700, fill:"var(--ok)"});
    if (r.gain) txt(svg, w-m.r+40, y+step/2+4, r.gain, {anchor:"end", size:12.5, weight:700, fill:"var(--accent)"});
  });
  txt(svg, m.l, h-4, "■ 기준선", {size:11, fill:"var(--warn)", weight:700});
  txt(svg, m.l+70, h-4, "■ "+(c.name||"후보"), {size:11, fill:"var(--ok)", weight:700});
};

/* 파이프라인 도해 */
CHART.pipeline = function(svg, w, h, c){
  const S = c.stages, n = S.length, gap = 16;
  const bw = (w - gap*(n-1))/n;
  S.forEach((s,i)=>{
    const x = i*(bw+gap);
    el("rect",{x:x,y:6,width:bw,height:h-30,rx:5,fill:"#fff",
      stroke: s.on?"var(--accent)":"#c9d2db","stroke-width":s.on?2.2:1.2},svg);
    el("rect",{x:x,y:6,width:bw,height:26,rx:5,fill:s.on?"var(--accent)":"#e6ebf0"},svg);
    txt(svg, x+bw/2, 24, s.tag, {anchor:"middle", weight:700, size:14, fill:s.on?"#fff":"#4a5866"});
    (s.lines||[]).forEach((t,j)=>
      txt(svg, x+11, 52+j*19, t, {size:12.5, fill:"#16202b"}));
    if (s.cost) txt(svg, x+bw/2, h-30, s.cost, {anchor:"middle", size:12.5, weight:700, fill:"var(--accent)"});
    if (i<n-1) el("path",{d:`M${x+bw+3} ${h/2-6}l9 6l-9 6`,stroke:"#9aa7b4",fill:"none","stroke-width":2},svg);
  });
};

/* 점그래프 — D_we 수준별 D30 분포 (P2 24건) */
CHART.dotplot = function(svg, w, h, c){
  const P = DATA.p2, m={l:76,r:20,t:14,b:30};
  const groups = [...new Set(P.map(d=>d.D_we))].sort((a,b)=>a-b);
  const vals = P.map(d=>d.D30_UW);
  const x0 = Math.min.apply(null, vals)*0.9, x1 = Math.max.apply(null, vals)*1.08;
  const X = v => m.l + (v-x0)/(x1-x0)*(w-m.l-m.r);
  const step = (h-m.t-m.b)/groups.length;
  niceTicks(x0,x1,5).forEach(v=>{
    el("line",{x1:X(v),y1:m.t,x2:X(v),y2:h-m.b,stroke:"#e4e9ee"},svg);
    txt(svg, X(v), h-m.b+15, v.toFixed(2), {anchor:"middle"});
  });
  frame(svg,w,h,m);
  txt(svg, w-m.r, h-3, "ΣD30_UW  (한계 0.5)", {anchor:"end", size:11.5});
  groups.forEach((g,i)=>{
    const y = m.t + step*(i+0.5);
    const G = P.filter(d=>d.D_we===g);
    const lo = Math.min.apply(null, G.map(d=>d.D30_UW));
    const hi = Math.max.apply(null, G.map(d=>d.D30_UW));
    el("rect",{x:X(lo)-4,y:y-15,width:X(hi)-X(lo)+8,height:30,rx:15,
      fill:"var(--accent)","fill-opacity":.07},svg);
    el("line",{x1:X(lo),y1:y,x2:X(hi),y2:y,stroke:"var(--accent)","stroke-opacity":.45,"stroke-width":1.4},svg);
    txt(svg, m.l-12, y+5, "D_we "+g, {anchor:"end", weight:700, size:13.5, fill:"#16202b"});
    G.forEach(d=>{
      const isA = d.set === "A";
      el("circle",{cx:X(d.D30_UW), cy:y + (isA?-6:6), r:5.2,
        fill: isA ? "var(--accent)" : "#fff",
        stroke: isA ? "none" : "var(--accent)", "stroke-width":1.8,
        "fill-opacity": isA?0.9:1},svg);
    });
    txt(svg, X(lo)-4, y-19, lo.toFixed(4), {anchor:"middle", size:10.5, fill:"#8695a4"});
    txt(svg, X(hi)+4, y+26, hi.toFixed(4), {anchor:"middle", size:10.5, fill:"#8695a4"});
  });
  svg.parentNode.insertAdjacentHTML("afterend",
    `<div class="legend"><span><i style="background:var(--accent)"></i>집합 A (z1 = 1.0)</span>
     <span><i style="background:#fff;border:1.8px solid var(--accent)"></i>집합 B (z1 = 1.5)</span>
     <span>· 가로 막대 = 각 수준의 분포 범위</span></div>`);
};

/* 기울기 차트 — α 27→31 의 부호 반전 */
CHART.slopes = function(svg, w, h, c){
  const P = DATA.p2, m={l:52,r:150,t:18,b:32};
  const pairs = c.pairs.map(p=>({
    a: P.find(d=>d.design===p[0]), b: P.find(d=>d.design===p[1]), note:p[2]
  })).filter(p=>p.a&&p.b);
  const vals = pairs.flatMap(p=>[p.a.D30_UW, p.b.D30_UW]);
  const y0 = Math.min.apply(null,vals)*0.92, y1 = Math.max.apply(null,vals)*1.06;
  const Y = v => h-m.b - (v-y0)/(y1-y0)*(h-m.t-m.b);
  const xa = m.l+40, xb = w-m.r-30;
  niceTicks(y0,y1,4).forEach(v=>{
    el("line",{x1:m.l,y1:Y(v),x2:w-m.r,y2:Y(v),stroke:"#e4e9ee"},svg);
    txt(svg, m.l-6, Y(v)+4, v.toFixed(3), {anchor:"end"});
  });
  frame(svg,w,h,m);
  txt(svg, xa, h-m.b+16, "α = 27°", {anchor:"middle", weight:700, size:12.5});
  txt(svg, xb, h-m.b+16, "α = 31°", {anchor:"middle", weight:700, size:12.5});
  txt(svg, 8, m.t-4, "ΣD30_UW", {size:11.5});
  pairs.forEach(p=>{
    const ya=Y(p.a.D30_UW), yb=Y(p.b.D30_UW);
    const down = p.b.D30_UW < p.a.D30_UW;
    const col = down ? "var(--ok)" : "var(--warn)";
    el("line",{x1:xa,y1:ya,x2:xb,y2:yb,stroke:col,"stroke-width":2.4},svg);
    el("circle",{cx:xa,cy:ya,r:5,fill:col},svg);
    el("circle",{cx:xb,cy:yb,r:5,fill:col},svg);
    const pct = (p.b.D30_UW/p.a.D30_UW-1)*100;
    txt(svg, xb+12, yb+4, (pct>0?"+":"")+pct.toFixed(1)+"%  "+(down?"유리":"불리"),
      {weight:700, size:12.5, fill:col});
    txt(svg, xb+12, yb+19, p.note, {size:11, fill:"#8695a4"});
    txt(svg, xa-10, ya+4, p.a.design, {anchor:"end", size:11, fill:"#8695a4"});
  });
};

/* 종속 사슬 도해 */
CHART.chain = function(svg, w, h, c){
  const S = c.steps, n = S.length, gap = 8;
  const bh = (h - gap*(n-1))/n;
  S.forEach((s,i)=>{
    const y = i*(bh+gap);
    const lead = i===0;
    el("rect",{x:0,y:y,width:w,height:bh,rx:4,
      fill: lead ? "var(--accent)" : "#fff",
      stroke: lead ? "none" : "#c9d2db", "stroke-width":1.2},svg);
    el("rect",{x:0,y:y,width:96,height:bh,rx:4,
      fill: lead ? "#0b2d52" : "#eef2f6"},svg);
    txt(svg, 48, y+bh/2+4, s.tag, {anchor:"middle", weight:700, size:12.5,
      fill: lead ? "#fff" : "var(--accent)"});
    txt(svg, 108, y+bh/2+4, s.text, {size:13, weight:lead?700:400,
      fill: lead ? "#fff" : "#16202b"});
    if (s.note) txt(svg, w-8, y+bh/2+4, s.note, {anchor:"end", size:11,
      fill: lead ? "#cfe0f2" : "#8695a4"});
    if (i<n-1) el("path",{d:`M52 ${y+bh}l0 ${gap}`,stroke:"#9aa7b4","stroke-width":1.6},svg);
  });
};

/* ═══════════════ 렌더 ═══════════════ */
function buildTable(t){
  let s = "<table><thead><tr>";
  t.head.forEach(h=> s += `<th class="${/[\d\[]/.test(h)?"num":""}">${h}</th>`);
  s += "</tr></thead><tbody>";
  t.rows.forEach(r=>{
    const cls = r.cls ? ` class="${r.cls}"` : "";
    const cells = r.cells || r;
    s += `<tr${cls}>` + cells.map((c,i)=>
      `<td class="${i>0?"num":""}">${c}</td>`).join("") + "</tr>";
  });
  return s + "</tbody></table>";
}

function renderBlock(b, host){
  if (b.type === "kpis"){
    const d = document.createElement("div");
    d.className = "kpis";
    d.innerHTML = b.items.map(k=>
      `<div class="kpi ${k.tone||""}"><div class="v">${k.value}</div>
       <div class="l">${k.label}</div>${k.sub?`<div class="s">${k.sub}</div>`:""}</div>`).join("");
    host.appendChild(d);
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  if (b.flex) card.style.flex = b.flex;
  if (b.title) card.innerHTML = `<h3>${b.title}</h3>`;
  if (b.type === "table") card.innerHTML += buildTable(b);
  else if (b.type === "points") card.innerHTML +=
    `<ul class="pts">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  else {
    const box = document.createElement("div");
    box.className = "svgbox";
    card.appendChild(box);
    host.appendChild(card);
    const r = box.getBoundingClientRect();
    // 무대가 scale() 로 축소돼 있으므로 실좌표(1280×720 기준)로 되돌린다
    const W = Math.max(200, r.width / SCALE), H = Math.max(120, r.height / SCALE);
    const svg = el("svg", {viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:"none"}, box);
    (CHART[b.type] || function(){})(svg, W, H, b);
    return;
  }
  host.appendChild(card);
}

const SETS = {
  A: { label:"안 A · 제약 충돌 6장", slides: SLIDES_A },
  B: { label:"안 B · 발견 누적 7장", slides: SLIDES_B },
};
let SET = "A", cur = 0;

function switchSet(k){ if (SETS[k]) { SET = k; render(0); } }

function render(i){
  const SLIDES = SETS[SET].slides;
  cur = (i + SLIDES.length) % SLIDES.length;
  const s = SLIDES[cur];
  document.getElementById("title").textContent = s.title;
  document.getElementById("lead").textContent = s.lead || "";
  document.getElementById("take").textContent = s.takeaway || "";
  document.getElementById("counter").textContent =
    (s.no || cur+1) + " / " + SLIDES.length + "   ·   메인베어링 사이징 최적화";
  const sw = document.getElementById("setsw");
  sw.innerHTML = Object.keys(SETS).map(k=>
    `<div class="sw ${k===SET?"on":""}" data-k="${k}">${SETS[k].label}</div>`).join("");
  sw.querySelectorAll(".sw").forEach(b=>b.onclick=()=>switchSet(b.dataset.k));
  const dots = document.getElementById("dots");
  dots.innerHTML = SLIDES.map((_,j)=>`<div class="dot ${j===cur?"on":""}" data-i="${j}"></div>`).join("");
  dots.querySelectorAll(".dot").forEach(d=>d.onclick=()=>render(+d.dataset.i));

  const body = document.getElementById("body");
  body.innerHTML = "";
  (s.rows||[]).forEach(row=>{
    const r = document.createElement("div");
    r.className = "row" + (row.grow===false ? "" : " grow");
    body.appendChild(r);
    row.blocks.forEach(b=>renderBlock(b, r));
  });
}

let SCALE = 1;
function fit(){
  const sc = SCALE = Math.min(window.innerWidth/1300, window.innerHeight/740);
  document.getElementById("stage").style.transform = `scale(${sc})`;
  document.getElementById("wrap").style.width  = (1280*sc)+"px";
  document.getElementById("wrap").style.height = (720*sc)+"px";
  document.getElementById("stage").style.position = "absolute";
  document.getElementById("stage").style.left = ((1280*sc-1280)/2)+"px";
  document.getElementById("stage").style.top  = ((720*sc-720)/2)+"px";
}
window.addEventListener("resize", ()=>{fit(); render(cur);});
document.addEventListener("keydown", e=>{
  if (e.key === "ArrowRight" || e.key === " ") render(cur+1);
  if (e.key === "ArrowLeft") render(cur-1);
  if (e.key === "a" || e.key === "A") switchSet("A");
  if (e.key === "b" || e.key === "B") switchSet("B");
});
fit();
render(0);
</script>
