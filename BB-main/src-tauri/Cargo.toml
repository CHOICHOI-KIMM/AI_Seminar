[package]
name = "bb-contact-analysis"
version = "0.1.0"
description = "BB Contact Analysis System - Angular Contact Ball Bearing (ACBB)"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
sprs = "0.11"
rayon = "1"
rustfft = "6"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"
log = "0.4"

[dev-dependencies]
approx = "0.5"
